<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Entrar — Fundação Toque</title>
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="assets/css/variables.css" />
  <link rel="stylesheet" href="assets/css/reset.css" />
  <link rel="stylesheet" href="assets/css/layout.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/pages.css" />
</head>
<body>
  <main class="login-page">
    <img src="assets/img/logo.svg" alt="Fundação Toque" class="login-logo" />
    <div class="login-card">
      <h1>Bem-vindo de volta</h1>
      <p class="subtitle">Acesse o sistema de gestão</p>

      <form id="loginForm" onsubmit="return fazerLogin(event)">
        <div class="form-group">
          <label for="email">E-mail <span class="required">*</span></label>
          <input type="email" id="email" class="input" placeholder="seu@email.com" value="pedagoga@fundacaotoque.org.br" required />
        </div>

        <div class="form-group">
          <label for="senha">Senha <span class="required">*</span></label>
          <input type="password" id="senha" class="input" placeholder="••••••••" value="123456" required />
        </div>

        <div class="form-group">
          <label>Entrar como <span class="required">*</span></label>
          <div class="role-selector" id="roleSelector">
            <label class="role-option selected" data-role="pedagoga">
              <input type="radio" name="role" value="pedagoga" checked />
              <i class="fa-solid fa-chalkboard-user"></i>
              <span>Pedagoga</span>
            </label>
            <label class="role-option" data-role="admin">
              <input type="radio" name="role" value="admin" />
              <i class="fa-solid fa-user-tie"></i>
              <span>Administrativo</span>
            </label>
            <label class="role-option" data-role="direcao">
              <input type="radio" name="role" value="direcao" />
              <i class="fa-solid fa-user-shield"></i>
              <span>Direção</span>
            </label>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg">
          <i class="fa-solid fa-right-to-bracket"></i> Entrar
        </button>

        <p style="text-align:center; margin-top: var(--esp-4);">
          <a href="#">Esqueci minha senha</a>
        </p>
      </form>

      <p class="login-footer">
        Fundação Toque — Capacitar pessoas com deficiência para sua autonomia social.<br />
        © 2026 — Todos os direitos reservados
      </p>
    </div>
  </main>

  <a href="https://wa.me/5516997029696" target="_blank" class="whatsapp-float" aria-label="WhatsApp">
    <i class="fa-brands fa-whatsapp"></i>
  </a>

  <script src="assets/js/modals.js"></script>
  <script>
    document.querySelectorAll('.role-option').forEach(opt => {
      opt.addEventListener('click', () => {
        document.querySelectorAll('.role-option').forEach(o => o.classList.remove('selected'));
        opt.classList.add('selected');
        opt.querySelector('input').checked = true;
      });
    });

    function fazerLogin(e) {
      e.preventDefault();
      const role = document.querySelector('input[name="role"]:checked').value;
      const emails = {
        pedagoga: 'pedagoga@fundacaotoque.org.br',
        admin: 'admin@fundacaotoque.org.br',
        direcao: 'direcao@fundacaotoque.org.br'
      };
      const nomes = {
        pedagoga: 'Ana Carolina Silva',
        admin: 'Roberto Mendes',
        direcao: 'Maria Aparecida Santos'
      };
      sessionStorage.setItem('toque_user', JSON.stringify({
        role, email: emails[role], nome: nomes[role]
      }));
      window.location.href = 'dashboard.html';
    }
  </script>
</body>
</html>
